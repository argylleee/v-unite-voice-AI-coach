name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Integration tests
        run: npm run test:integration -- --run

      - name: Production build
        run: npm run build

      # Design-quality gate (docs/DEVELOPMENT_PLAN.md Phase 8, docs/UI_DESIGN.md). Fails the
      # check on any unaddressed "AI slop" finding in src/.
      - name: Impeccable design lint
        run: npx impeccable detect --json src/

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Production build
        # No env needed: every env read in the app is lazy (request-time), and the e2e run
        # stubs all /api/* calls with page.route().
        run: npm run build

      - name: Run E2E suite
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Deploy to Vercel production — ONLY on a push to main, and ONLY after quality + e2e pass.
  # This is requirement #16 ("a deployment should fail when required checks fail"): a red check
  # means this job is skipped and the production domain keeps serving the last good deploy.
  # Auto-deploys from Git are turned off for main in vercel.json, so this is the only path to
  # production. Env vars are set once in the Vercel dashboard; `vercel pull` fetches them here.
  deploy:
    name: deploy
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel project + production env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
