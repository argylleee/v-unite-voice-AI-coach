name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Production build
        # No env needed: every env read in the app is lazy (request-time), and the e2e run
        # stubs all /api/* calls with page.route().
        run: npm run build

      - name: Run E2E suite
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # NOTE: per docs/DEPLOYMENT.md, add this job ("e2e") alongside "quality" under Vercel
  # Project Settings -> Deployment Checks once it is producing a stable check.
