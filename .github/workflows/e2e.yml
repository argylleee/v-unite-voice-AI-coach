name: E2E

on:
  push:
  pull_request:

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build
        env:
          # The e2e run stubs every /api/* call with page.route(), so these only need to be
          # present for the build/route modules to load — not real.
          N8N_CHAT_WEBHOOK_URL: https://example.invalid/webhook/coach
          N8N_VOICE_WEBHOOK_URL: https://example.invalid/webhook/voice
          N8N_KNOWLEDGE_WEBHOOK_URL: https://example.invalid/webhook/knowledge
          N8N_SUMMARY_WEBHOOK_URL: https://example.invalid/webhook/summary
          N8N_WEBHOOK_SECRET: ci-not-real
          SUPABASE_URL: https://example.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-not-real
          NEXT_PUBLIC_CLINIC_ID: 80a1c835-ed66-4c0c-8c3c-52c5e90fdbf4
          NEXT_PUBLIC_CLINIC_NAME: V-Unite Aesthetic Clinic

      - name: Run Playwright smoke
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # NOTE: per docs/DEPLOYMENT.md, add this job ("e2e") alongside "quality" under Vercel
  # Project Settings -> Deployment Checks once it is producing a stable check.
